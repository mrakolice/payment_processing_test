[project]
name = "payment-processing-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "faststream-fastapi>=1.3.1",
    "faststream[cli,rabbit]>=0.7.5",
    "flask>=3.1.3",
    "google-api-python-client>=2.200.0",
    "httplib2>=0.32.0",
    "httpx>=0.28.1",
    "mysql-connector-python>=26.7.0",
    "oauth2client>=4.1.3",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pylint>=4.0.8",
    "pylint-google-style-guide-imports-enforcing>=1.3.1",
    "ruff>=0.16.7",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlalchemy-declarative-extensions>=0.16.11",
    "sqlmodel>=0.0.42",
    "uvicorn>=0.53.0",
]

[tool.ruff]
line-length = 120
exclude = [
    'app/database/env.py',
    'app/database/versions/',
    'app/database/models/__init__.py',
]

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ["E", "W", "C", "F", "N", 'I', 'PLR', 'UP']

[tool.pylint]
disable = 'all'
load-plugins = ['pylint_google_style_guide_imports_enforcing']
enable = 'C5101'
ignore-paths = []

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["PLR2004"]

